line-length = 88
target-version = "py311"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "SIM"]

[lint.per-file-ignores]
"main.py" = ["B008"]
"app/api/*.py" = ["B008"]
"app/security/dependencies.py" = ["B008"]
"tests/conftest.py" = ["E402"]

[lint.isort]
known-first-party = ["app"]
